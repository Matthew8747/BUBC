name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bubc/web test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: Playwright smoke
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @bubc/web exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - run: pnpm --filter @bubc/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Lighthouse CI — advisory only (warn, don't error) until baselines settle.
  # See plan.md §9b "Performance" + apps/web/.lighthouserc.json.
  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Run Lighthouse CI
        working-directory: apps/web
        run: pnpm test:lhci

  # Pa11y accessibility checks across every key page. Same advisory posture
  # for the first two weeks; tighten to required once baselines settle.
  a11y:
    name: Pa11y accessibility
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Start static server
        working-directory: apps/web
        run: |
          pnpm exec http-server dist -p 4322 -s -c-1 &
          sleep 3
      # pa11y-ci pulls puppeteer-core, which does NOT auto-download a browser.
      # ubuntu-latest GitHub runners ship Google Chrome pre-installed at
      # /usr/bin/google-chrome — point puppeteer at it via env, avoiding a
      # ~50 MB download and matching whatever Chrome version the runner ships.
      #
      # .pa11yci.json ignores two axe rules, since JSON takes no comments:
      #   color-contrast — the htmlcs runner already covers contrast, and running
      #     both double-reports every finding.
      #   frame-tested   — axe cannot inject itself into the cross-origin
      #     OpenStreetMap embed on /boathouse/, so it reports "could not test"
      #     rather than an actual defect. Nothing on our side can satisfy it.
      - name: Run pa11y-ci
        working-directory: apps/web
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: pnpm test:a11y
